<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando Catálogo Oficial...</title>
  <style>
    body {
      background: #0b0f19;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #00d26a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .loading-sub {
      font-size: 0.85rem;
      color: #86868b;
    }
  </style>
  <script>
    (function() {
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      // Extraer segmentos de ruta
      var segments = path.split('/').filter(Boolean);
      var slug = "";

      if (segments.length > 0) {
        var last = segments[segments.length - 1];
        if (!last.endsWith(".html") && last !== "micro-catalogo-whatsapp") {
          slug = last;
        }
      }

      // Determinar basePath
      var basePath = "/";
      if (segments.length > 0 && segments[0] === "micro-catalogo-whatsapp") {
        basePath = "/micro-catalogo-whatsapp/";
      } else {
        basePath = path.substring(0, path.lastIndexOf('/') + 1) || '/';
      }

      var target = basePath + "index.html";
      var params = new URLSearchParams(search);

      if (slug && !params.has("tienda")) {
        params.set("tienda", slug);
      }
      if (!params.has("mode")) {
        params.set("mode", "shop");
      }

      var query = params.toString() ? ("?" + params.toString()) : "";
      window.location.replace(target + query + hash);
    })();
  </script>
</head>
<body>
  <div class="spinner"></div>
  <div class="loading-title">Cargando Catálogo Oficial...</div>
  <div class="loading-sub">Conectando con la vitrina digital segura</div>
</body>
</html>
